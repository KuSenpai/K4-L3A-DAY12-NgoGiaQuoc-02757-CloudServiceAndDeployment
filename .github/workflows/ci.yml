# CI/CD: mỗi lần push/PR → chạy test + build image trên máy sạch của GitHub.
# Chỉ khi cả hai xanh VÀ là push lên main → deploy lên Railway rồi smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hai lần push liên tiếp không deploy chồng lên nhau
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLIC_URL: https://day12-agent-production-78ea.up.railway.app

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        # Bỏ test_cp5 (gọi vào bản deploy đang sống) và test_bonus_cicd (tự
        # kiểm tra badge của chính workflow này). Test build Docker để job build lo.
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t day12-agent:ci .

      - name: Image size
        run: docker images day12-agent:ci --format "{{.Repository}}:{{.Tag}} {{.Size}}"

      - name: Container starts and /health is 200
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// day12-agent:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5

      - name: railway up
        # Project token: Railway → project → Settings → Tokens.
        # Lưu ở GitHub → Settings → Secrets and variables → Actions.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service day12-agent --ci

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$PUBLIC_URL/health" && curl -fsS "$PUBLIC_URL/ready"; then
              echo; echo "deploy OK"; exit 0
            fi
            sleep 10
          done
          echo "service không healthy sau deploy"; exit 1
